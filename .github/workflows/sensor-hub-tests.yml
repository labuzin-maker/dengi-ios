name: Sensor Hub tests

on:
  pull_request:
    paths:
      - "sensor-hub/**"
      - ".github/workflows/sensor-hub-tests.yml"
  push:
    branches:
      - main
      - "fix/**"
    paths:
      - "sensor-hub/**"
      - ".github/workflows/sensor-hub-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r sensor-hub/requirements.txt pycryptodome
      - name: Compile Python modules
        working-directory: sensor-hub
        run: python -m compileall -q hub tests
      - name: Run test suite
        working-directory: sensor-hub
        run: python -m unittest tests.test_all -v
