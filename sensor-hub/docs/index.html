<html lang="ru">

<title>Датчики дома</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&display=swap">
<style>
/* Раскладка: сверху сводка по дому, ниже три блока по смыслу — климат (плитки с мини-графиком), безопасность (строки-статусы), управление (кнопки-плитки). */
:root {
  --bg: #e9eff0; --surface: #f9fbfb; --raised: #ffffff; --line: #cddadc; --fg: #12232a; --muted: #5a7078;
  --accent: #0a6f6b; --accent-fg: #ffffff; --accent-soft: #d3e8e6;
  --ok: #1d7a46; --ok-soft: #d6ecdd; --warn: #955800; --warn-soft: #f6e5c5; --crit: #b3261e; --crit-soft: #f7d9d6;
  --ui: "Golos Text", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0c1416; --surface: #152124; --raised: #1b2a2e; --line: #2a3e43; --fg: #e4eff0; --muted: #8aa1a7;
  --accent: #52c8c0; --accent-fg: #052221; --accent-soft: #153a39;
  --ok: #6fd296; --ok-soft: #15331f; --warn: #f1ba63; --warn-soft: #3a2c10; --crit: #ff8a80; --crit-soft: #45191a; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0c1416; --surface: #152124; --raised: #1b2a2e; --line: #2a3e43; --fg: #e4eff0; --muted: #8aa1a7;
  --accent: #52c8c0; --accent-fg: #052221; --accent-soft: #153a39;
  --ok: #6fd296; --ok-soft: #15331f; --warn: #f1ba63; --warn-soft: #3a2c10; --crit: #ff8a80; --crit-soft: #45191a; color-scheme: dark }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font: 400 15px/1.4 var(--ui); -webkit-text-size-adjust: 100%; font-variant-numeric: tabular-nums; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; -webkit-tap-highlight-color: transparent; }
button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
svg.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.wrap { max-width: 720px; margin: 0 auto; padding-block: 16px 44px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 20px; }

/* сводка */
.hero { display: flex; flex-direction: column; gap: 12px; }
.hero-top { display: flex; align-items: center; gap: 10px; }
.hero-top h1 { font-size: 15px; font-weight: 600; margin: 0; flex: 1; min-width: 0; color: var(--muted); letter-spacing: .02em; }
.link { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.dot.live { background: var(--ok); }
.icon-btn { width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; border: 1px solid var(--line); background: var(--surface); }
.now { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
.now .t { font-size: 54px; font-weight: 700; line-height: 1; letter-spacing: -0.03em; }
.now .h { font-size: 22px; font-weight: 600; color: var(--muted); }
.now .cap { flex-basis: 100%; font-size: 13px; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 11px; border-radius: 999px; font-size: 13.5px; font-weight: 500; background: var(--surface); color: var(--fg); }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.crit { background: var(--crit-soft); color: var(--crit); }
.chip svg.i { width: 15px; height: 15px; }
.note { font-size: 13.5px; padding: 10px 12px; border-radius: 10px; background: var(--accent-soft); }
.alert { padding: 11px 13px; border-radius: 12px; font-weight: 600; }
.alert.crit { background: var(--crit-soft); color: var(--crit); }
.alert.warn { background: var(--warn-soft); color: var(--warn); font-weight: 500; }
.alerts { display: flex; flex-direction: column; gap: 6px; }

.rooms { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin-inline: -4px; padding: 2px 4px; }
.rooms::-webkit-scrollbar { display: none; }
.rooms button { flex: none; padding: 7px 13px; border-radius: 999px; border: 1px solid var(--line); font-size: 14px; white-space: nowrap; }
.rooms button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }

.sec { display: flex; flex-direction: column; gap: 10px; }
.sec > h2 { margin: 0; font-size: 12.5px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); display: flex; gap: 8px; align-items: baseline; }
.sec > h2 span { font-weight: 400; letter-spacing: 0; text-transform: none; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(158px, 1fr)); gap: 10px; }

/* климат */
.cl { background: var(--surface); border-radius: 16px; padding: 13px 13px 11px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.cl.stale { opacity: .6; }
.cl .room { font-size: 11.5px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--accent); display: flex; justify-content: space-between; gap: 6px; }
.cl .name { font-size: 13.5px; color: var(--muted); overflow-wrap: anywhere; line-height: 1.25; }
.cl .big { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.cl .big b { font-size: 34px; font-weight: 700; line-height: 1.05; letter-spacing: -0.02em; }
.cl .big span { font-size: 17px; font-weight: 600; color: var(--muted); display: inline-flex; align-items: center; gap: 3px; }
.cl .big span svg.i { width: 13px; height: 13px; }
.cl svg.spark { width: 100%; height: 34px; display: block; }
.cl .foot { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; gap: 6px; flex-wrap: wrap; }
.cl .foot .w { color: var(--warn); font-weight: 500; }
.cl .foot .g { color: var(--ok); font-weight: 500; }
.bat { font-size: 11.5px; font-weight: 500; color: var(--muted); letter-spacing: 0; text-transform: none; white-space: nowrap; }
.bat.low { color: var(--warn); }

/* безопасность */
.list { background: var(--surface); border-radius: 16px; display: flex; flex-direction: column; }
.rowb { display: flex; align-items: center; gap: 11px; padding: 12px 13px; width: 100%; border-top: 1px solid var(--line); }
.rowb:first-child { border-top: 0; }
.rowb .ic { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--bg); color: var(--muted); flex: none; }
.rowb .ic.ok { background: var(--ok-soft); color: var(--ok); }
.rowb .ic.crit { background: var(--crit-soft); color: var(--crit); }
.rowb .ic.warn { background: var(--warn-soft); color: var(--warn); }
.rowb .tx { flex: 1; min-width: 0; }
.rowb .tx b { font-weight: 600; display: block; overflow-wrap: anywhere; }
.rowb .tx small { font-size: 12.5px; color: var(--muted); }
.rowb .st { font-size: 13.5px; font-weight: 600; white-space: nowrap; text-align: right; }
.rowb .st.ok { color: var(--ok); } .rowb .st.crit { color: var(--crit); } .rowb .st.warn { color: var(--warn); } .rowb .st.na { color: var(--muted); font-weight: 400; }
.rowb .st small { display: block; font-size: 11.5px; font-weight: 400; color: var(--muted); }

/* управление */
.sw { background: var(--surface); border: 1.5px solid transparent; border-radius: 16px; padding: 13px; display: flex; flex-direction: column; gap: 10px; min-height: 104px; min-width: 0; transition: background .15s, border-color .15s; }
.sw .ic { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--bg); color: var(--muted); transition: background .15s, color .15s; }
.sw[aria-checked="true"] { background: var(--accent-soft); border-color: var(--accent); }
.sw[aria-checked="true"] .ic { background: var(--accent); color: var(--accent-fg); }
.sw .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.sw .stt { font-size: 12.5px; font-weight: 600; color: var(--muted); }
.sw[aria-checked="true"] .stt { color: var(--accent); }
.sw b { font-weight: 600; font-size: 14.5px; line-height: 1.25; overflow-wrap: anywhere; display: block; }
.sw small { font-size: 12.5px; color: var(--muted); }
.sw[disabled] { opacity: .5; cursor: default; }
.more { align-self: flex-start; font-size: 12.5px; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; }
.hidden-list { font-size: 13px; color: var(--muted); }
.hidden-list button { text-decoration: underline; color: var(--accent); }
.empty { color: var(--muted); font-size: 14px; }

/* нижние листы */
.shade { position: fixed; inset: 0; background: rgba(6, 14, 16, .55); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--raised); color: var(--fg); width: 100%; max-width: 720px; max-height: 90%; overflow-y: auto; border-radius: 20px 20px 0 0;
  padding-block: 18px calc(22px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 14px; }
.sheet h3 { margin: 0; font-size: 19px; font-weight: 700; text-wrap: balance; overflow-wrap: anywhere; }
.sheet-head { display: flex; align-items: flex-start; gap: 10px; }
.sheet-head h3 { flex: 1; min-width: 0; }
.x { font-size: 14px; color: var(--accent); font-weight: 600; padding: 4px 2px; }
.sub { font-size: 13px; color: var(--muted); }
.field { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
.field input { font: 400 16px var(--ui); color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; width: 100%; }
.btn { background: var(--accent); color: var(--accent-fg); font-weight: 600; border-radius: 10px; padding: 11px 16px; text-align: center; }
.btn.ghost { background: none; color: var(--accent); border: 1px solid var(--line); }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.row > * { flex: 1 1 140px; }
.seg { display: flex; gap: 6px; flex-wrap: wrap; }
.seg button { padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); font-size: 13.5px; }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.cur { font-size: 40px; font-weight: 700; line-height: 1; letter-spacing: -0.02em; }
.cur i { font-size: 17px; font-weight: 500; color: var(--muted); font-style: normal; margin-left: 5px; letter-spacing: 0; }
.chart svg { width: 100%; height: auto; display: block; }
.chart .ax { font: 400 10.5px var(--ui); fill: var(--muted); }
.stats { display: flex; gap: 18px; font-size: 13px; color: var(--muted); }
.stats b { font-weight: 600; font-size: 14.5px; color: var(--fg); }
.all { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; }
.all div { background: var(--bg); border-radius: 10px; padding: 8px 10px; font-size: 12.5px; color: var(--muted); min-width: 0; }
.all b { display: block; font-size: 16px; font-weight: 600; color: var(--fg); }
details summary { font-size: 14px; color: var(--accent); font-weight: 600; cursor: pointer; }
details > div { display: flex; flex-direction: column; gap: 10px; padding-top: 10px; }
.src { display: flex; gap: 10px; align-items: flex-start; padding: 10px 0; border-top: 1px solid var(--line); }
.src:first-of-type { border-top: 0; }
.src .t { font-weight: 600; } .src .m { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.src > div { flex: 1; min-width: 0; }
.pill { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--ok-soft); color: var(--ok); white-space: nowrap; }
.pill.warn { background: var(--warn-soft); color: var(--warn); } .pill.crit { background: var(--crit-soft); color: var(--crit); }
.qr { display: flex; flex-direction: column; gap: 10px; align-items: center; text-align: center; font-size: 14px; }
.qr img { width: 200px; height: 200px; border-radius: 8px; background: #fff; }
.err { color: var(--crit); font-size: 14px; }
.hint { font-size: 13px; color: var(--muted); }
.video { display: flex; flex-direction: column; gap: 8px; }
.video video { width: 100%; max-width: 100%; aspect-ratio: 16 / 9; background: #000; border-radius: 12px; display: block; }
.ctls { display: flex; flex-direction: column; }
.ctls:empty { display: none; }
.ctl { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
.ctl:first-child { border-top: 0; }
.ctl > span:first-child { font-weight: 500; }
.ctl.col { flex-direction: column; align-items: stretch; gap: 8px; }
.stepper { display: inline-flex; align-items: center; gap: 4px; }
.stepper b { min-width: 72px; text-align: center; font-size: 18px; font-weight: 700; }
.stepper button { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--bg); font-size: 22px; line-height: 1; display: grid; place-items: center; }
.stepper button[disabled], .seg button[disabled], .tg[disabled] { opacity: .45; cursor: default; }
.tg { width: 52px; height: 32px; border-radius: 16px; background: var(--line); position: relative; flex: none; transition: background .15s; }
.tg i { position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: var(--raised); transition: transform .15s; }
.tg[aria-checked="true"] { background: var(--accent); }
.tg[aria-checked="true"] i { transform: translateX(20px); }
a { color: var(--accent); }
@media (prefers-reduced-motion: reduce) { .sw, .sw .ic, .tg, .tg i { transition: none; } }
</style>

<div class="wrap">
  <div class="hero">
    <div class="hero-top">
      <h1>Датчики дома</h1>
      <span class="link"><span class="dot" id="dot"></span><span id="linkText">подключение</span></span>
      <button class="icon-btn" id="openSettings" aria-label="Источники датчиков"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></button>
    </div>
    <div class="note" id="demoNote" hidden><b>Демо-режим.</b> Это примеры. Чтобы видеть свои датчики, нажмите кнопку справа вверху и впишите адрес хаба.</div>
    <div id="now" class="now"></div>
    <div id="chips" class="chips"></div>
    <div id="alerts" class="alerts"></div>
  </div>
  <div id="rooms" class="rooms"></div>
  <div id="main" style="display:flex;flex-direction:column;gap:24px"></div>
  <div id="hiddenList" class="hidden-list"></div>
</div>
<div id="sheetHost"></div>

<script>
(() => {
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const store = { get(k) { try { return localStorage.getItem(k) } catch { return null } }, set(k, v) { try { localStorage.setItem(k, v) } catch {} } };
const I = { // значки
  thermo: '<path d="M10 5a2 2 0 1 1 4 0v8.6a4 4 0 1 1-4 0z"/>', drop: '<path d="M12 3.5c3 3.8 5.5 6.6 5.5 10a5.5 5.5 0 0 1-11 0c0-3.4 2.500-6.200 5.500-10z"/>',
  power: '<path d="M12 4v7"/><path d="M7.200 7.200a7 7 0 1 0 9.600 0"/>', shield: '<path d="M12 3l7 3v5.500c0 4.200-2.800 7.300-7 9.500-4.200-2.200-7-5.300-7-9.500V6z"/><path d="M9 12l2.200 2.200L15 10.500"/>',
  alert: '<path d="M12 4l9 15.500H3z"/><path d="M12 10v4.500M12 17.300v.2"/>', door: '<path d="M6 20V5a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v15M4 20h16M14.500 12v.2"/>',
  walk: '<circle cx="13" cy="5" r="1.600"/><path d="M9 20l2.500-6-2-2.500L11 8l3 2.500 3 1M11.500 14l3 2.500 1 3.500M7 11l2.500-2.500"/>', q: '<circle cx="12" cy="12" r="8.500"/><path d="M9.800 9.800a2.300 2.300 0 1 1 3.300 2.100c-.7.4-1.100.9-1.100 1.700M12 16.600v.2"/>',
  bulb: '<path d="M9 17h6M10 20h4M8 13.500a5.500 5.500 0 1 1 8 0c-.7.700-1 1.500-1 2.500h-6c0-1-.3-1.800-1-2.500z"/>', cam: '<rect x="3.500" y="7" width="12" height="10" rx="2"/><path d="M15.500 11l5-2.500v7l-5-2.500z"/>',
  usb: '<path d="M12 20V5M12 5l-2.500 3M12 5l2.500 3M7 11v2.500l5 2.500M17 9v3l-5 2.500"/>',
};
const ic = n => `<svg class="i" viewBox="0 0 24 24">${I[n] || I.q}</svg>`;

let mode = "connecting", state = { devices: [], drivers: [] }, sparks = {}, sheet = null;
let key = store.get("hubKey") || "", base = store.get("hubUrl") || "", room = store.get("room") || "", demoTimer = null, showOther = false;

/* ---------- формат ---------- */
const DEC = { temperature: 1, device_temp: 0, humidity: 0, battery: 0, illuminance: 0, power: 0, pressure: 0, co2: 0, voltage: 1, energy: 2 };
const fmt = (k, v) => v == null ? "—" : Number(v).toLocaleString("ru-RU", { minimumFractionDigits: DEC[k] ?? 0, maximumFractionDigits: DEC[k] ?? 1 });
const BIN = { motion: ["Тихо", "Движение"], contact: ["Закрыто", "Открыто"], leak: ["Сухо", "Протечка"], smoke: ["Чисто", "Дым"] };
const nowS = () => Date.now() / 1000;
const ago = ts => { if (!ts) return ""; const s = nowS() - ts;
  if (s < 90) return "только что"; if (s < 3600) return Math.round(s / 60) + " мин назад";
  if (s < 86400) return Math.round(s / 3600) + " ч назад"; return Math.round(s / 86400) + " дн назад"; };
const plural = (n, a, b, c) => { const m = n % 100, k = n % 10; return m > 10 && m < 20 ? c : k === 1 ? a : k > 1 && k < 5 ? b : c; };
const SRC = { xiaomi: "Xiaomi", ble: "Bluetooth", shelly: "Shelly", demo: "пример" };
const SEC_KEYS = ["leak", "smoke", "contact", "motion"];
const SEC_CATS = /submersion|magnet|motion|smoke|gas-sensor|occupancy|door/;
const ent = (d, k) => d.entities.find(e => e.key === k);
const fresh = e => !!(e && e.value != null && nowS() - e.ts < 3 * 3600);
const isClimate = d => !!(ent(d, "temperature") || ent(d, "humidity"));
const isSecurity = d => d.entities.some(e => SEC_KEYS.includes(e.key)) || SEC_CATS.test(d.category || "") || (!d.entities.length && /утеч|протеч|leak|двер|движен/i.test(d.name));

/* ---------- связь с хабом ---------- */
async function api(path, body) {
  const r = await fetch(base + "api/" + path, { method: body ? "POST" : "GET", headers: { "Content-Type": "application/json", "X-Key": key }, body: body ? JSON.stringify(body) : undefined });
  if (r.status === 401) { openSheet({ type: "key" }); throw new Error("Нужен ключ доступа"); }
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || "Ошибка хаба");
  return j;
}
let es = null, pollTimer = null, sparkTimer = null;
function listen() {
  if (es) es.close();
  clearInterval(pollTimer); clearInterval(sparkTimer);
  es = new EventSource(base + "api/events" + (key ? "?key=" + encodeURIComponent(key) : ""));
  es.onmessage = m => { setLink(true); state = JSON.parse(m.data); render(); };
  es.onerror = () => setLink(false);
  pollTimer = setInterval(async () => { if (es.readyState !== 1) { try { state = await api("state"); setLink(true); render(); } catch { setLink(false); } } }, 10000);
  const loadSparks = async () => { try { sparks = await api("sparks"); render(); } catch {} };
  loadSparks(); sparkTimer = setInterval(loadSparks, 600000);
}
function setLink(ok) {
  $("#dot").classList.toggle("live", ok);
  $("#linkText").textContent = mode === "demo" ? "демо" : ok ? "на связи" : "нет связи с хабом";
}
async function boot() {
  const noHub = /github\.io$|claude/.test(location.hostname) || location.protocol === "file:";
  if (!noHub || base) {
    try {
      const ctl = new AbortController(); setTimeout(() => ctl.abort(), 5000);
      const r = await fetch(base + "api/state", { headers: { "X-Key": key }, signal: ctl.signal });

    h = head(d.name) + `<div class="sub">${esc(d.room)} · ${esc(SRC[d.driver] || d.driver)}${d.model ? " · " + esc(d.model) : ""}${d.online ? "" : " · нет связи"}</div>${(d.caps || []).includes("video") ? `<div id="devVideo" class="video">${sheet.video?.url ? `<video src="${esc(sheet.video.url)}" controls autoplay muted playsinline></video>` : `<button class="btn" data-act="video" ${d.online ? "" : "disabled"}>${sheet.video?.loading ? "Запрашиваю видео у камеры…" : "Смотреть видео"}</button>`}${sheet.video?.err ? `<div class="err">${esc(sheet.video.err)}</div>` : ""}</div>` : ""}<div id="devCtl" class="ctls">${ctlHtml(d)}</div>`;
    if (e) {
      const cur = e.kind === "binary" ? (e.value == null ? "—" : (BIN[e.key] || ["Нет", "Да"])[+!!e.value]) : `${fmt(e.key, e.value)}<i>${esc(e.unit)}</i>`;
      h += (list.length > 1 ? `<div class="seg">${list.map(x => `<button data-act="pick" data-e="${esc(x.id)}" aria-pressed="${x.id === e.id}">${esc(x.name)}</button>`).join("")}</div>` : "")
        + `<div><div class="cur">${cur}</div><div class="sub">${esc(e.name)} · обновлено ${esc(ago(e.ts) || "—")}</div></div>
        <div class="seg">${[[24, "Сутки"], [168, "Неделя"], [720, "Месяц"]].map(([hh, l]) => `<button data-act="period" data-h="${hh}" aria-pressed="${sheet.hours === hh}">${l}</button>`).join("")}</div>
        <div class="chart">${sheet.data ? chart(sheet.data, e, sheet.hours) : `<div class="sub">Загружаю историю…</div>`}</div>`;
    } else h += `<div class="sub">${d.entities.length ? "" : "Это устройство пока не передаёт показаний, которые панель умеет читать."}</div>`;
    h += `<details ${e || d.entities.some(x => x.writable) ? "" : "open"}><summary>Название, комната, скрыть</summary><div>
      <label class="field">Название<input id="devName" value="${esc(d.name)}" autocomplete="off"></label>
      <label class="field">Комната<input id="devRoom" value="${esc(d.room === "Без комнаты" ? "" : d.room)}" autocomplete="off" placeholder="Например, Кухня"></label>
      <div class="row"><button class="btn" data-act="saveDev">Сохранить</button><button class="btn ghost" data-act="toggleHide">${d.hidden ? "Показывать на панели" : "Скрыть с панели"}</button></div></div></details>
      ${sheet.err ? `<div class="err">${esc(sheet.err)}</div>` : ""}`;
  }
  if (sheet.type === "settings") {
    const P = { ok: ["", "работает"], need_login: ["warn", "нужен вход"], error: ["crit", "ошибка"], starting: ["warn", "запуск"] };
    const srcs = state.drivers.map(s => { const [c, l] = P[s.status] || ["", s.status];
      let extra = "";
      if (s.name === "xiaomi" && mode === "live") extra = s.status === "need_login"
        ? `<div style="margin-top:8px"><button class="btn" data-act="xiaomiLogin">Войти в Mi Home</button></div>`
        : `<div style="margin-top:6px"><button class="x" data-act="xiaomiLogout">Выйти из аккаунта</button></div>`;
      return `<div class="src"><div><div class="t">${esc(s.title)}</div><div class="m">${esc(s.message)}</div>${extra}</div><span class="pill ${c}">${l}</span></div>`; }).join("");
    let qr = "";
    if (sheet.qr) qr = `<div class="qr"><img src="${esc(sheet.qr.qr)}" alt="QR-код для входа в Xiaomi"><div>Отсканируйте код в приложении Mi Home и подтвердите вход.</div><a href="${esc(sheet.qr.login_url)}" target="_blank" rel="noopener">Или откройте страницу входа Xiaomi</a></div>`;
    h = head("Источники датчиков") + (mode === "demo" ? `<label class="field">Адрес вашего хаба (начинается с https://)<input id="hubUrl" inputmode="url" autocomplete="off" placeholder="https://datchiki.example.ru" value="${esc(base)}"></label><button class="btn" data-act="saveHub">Подключиться к хабу</button>`
      : base ? `<div class="hint">Хаб: ${esc(base)} <button class="x" data-act="dropHub">Отключиться</button></div>` : "") + srcs + qr
      + (sheet.err ? `<div class="err">${esc(sheet.err)}</div>` : "")
      + `<div class="hint">Новый датчик Xiaomi добавляйте в приложении Mi Home: в панели он появится сам в течение 10 минут.</div>`
      + (mode === "live" ? `<div class="hint"><a href="${esc(base)}api/diagnostics${key ? "?key=" + encodeURIComponent(key) : ""}" target="_blank" rel="noopener">Диагностика</a>: список устройств для разбора, если что-то не отображается.</div>` : "");
    if (sheet.qr && state.drivers.some(s => s.name === "xiaomi" && s.status !== "need_login")) sheet.qr = null;
  }
  host.innerHTML = `<div class="shade"><div class="sheet" role="dialog" aria-modal="true">${h}</div></div>`;
}
async function loadHistory() {
  const s = sheet, [, e] = findEnt(s.eid || ""); if (!e) return;
  try { s.data = mode === "demo" ? demoHistory(e, s.hours) : await api(`history?entity=${encodeURIComponent(e.id)}&hours=${s.hours}`); }
  catch { s.data = []; }
  if (sheet === s) drawSheet();
}
function chart(data, e, hours) {
  if (data.length < 2) return `<div class="sub">Истории пока мало: хаб копит её с момента запуска. График появится через несколько часов.</div>`;
  const W = 340, H = 160, L = 6, R = 46, T = 10, B = 22, t1 = nowS(), t0 = t1 - hours * 3600;
  const vs = data.map(p => p[1]); let lo = Math.min(...vs), hi = Math.max(...vs);
  const bin = e.kind !== "sensor"; if (bin) { lo = 0; hi = 1; }
  if (hi - lo < 1e-9) { hi += 1; lo -= 1; }
  const x = t => L + (W - L - R) * Math.max(0, (t - t0) / (t1 - t0)), y = v => T + (H - T - B) * (1 - (v - lo) / (hi - lo));
  let p = "", prev = null;
  for (const [t, v] of data) { p += (p ? (bin ? `L${x(t).toFixed(1)} ${y(prev).toFixed(1)}L` : "L") : "M") + `${x(t).toFixed(1)} ${y(v).toFixed(1)}`; prev = v; }
  const lastV = data[data.length - 1][1]; p += `L${x(t1).toFixed(1)} ${y(lastV).toFixed(1)}`;
  const area = p + `L${x(t1).toFixed(1)} ${H - B}L${x(data[0][0]).toFixed(1)} ${H - B}Z`;
  const lab = v => bin ? (BIN[e.key] || ["Нет", "Да"])[v] : fmt(e.key, v);
  const names = { 24: ["сутки назад", "12 ч назад"], 168: ["неделю назад", "3,5 дн назад"], 720: ["месяц назад", "15 дн назад"] }[hours];
  const avg = vs.reduce((a, b) => a + b, 0) / vs.length, mid = (lo + hi) / 2;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="График за период">
    <line x1="${L}" x2="${W - R}" y1="${y(hi)}" y2="${y(hi)}" stroke="var(--line)" stroke-dasharray="2 3"/>${bin ? "" : `<line x1="${L}" x2="${W - R}" y1="${y(mid)}" y2="${y(mid)}" stroke="var(--line)" stroke-dasharray="2 3"/>`}<line x1="${L}" x2="${W - R}" y1="${H - B}" y2="${H - B}" stroke="var(--line)"/>
    <path d="${area}" fill="var(--accent-soft)" stroke="none"/><path d="${p}" fill="none" stroke="var(--accent)" stroke-width="1.8" stroke-linejoin="round"/>
    <circle cx="${x(t1)}" cy="${y(lastV)}" r="3.5" fill="var(--accent)"/>
    <text class="ax" x="${W - R + 6}" y="${y(hi) + 3}">${lab(hi)}</text>${bin ? "" : `<text class="ax" x="${W - R + 6}" y="${y(mid) + 3}">${lab(mid)}</text>`}<text class="ax" x="${W - R + 6}" y="${H - B + 3}">${lab(lo)}</text>
    <text class="ax" x="${L}" y="${H - 6}">${names[0]}</text><text class="ax" x="${(L + W - R) / 2}" y="${H - 6}" text-anchor="middle">${names[1]}</text><text class="ax" x="${W - R}" y="${H - 6}" text-anchor="end">сейчас</text></svg>`
    + (bin ? "" : `<div class="stats"><span>мин <b>${fmt(e.key, Math.min(...vs))}</b></span><span>средн <b>${fmt(e.key, avg)}</b></span><span>макс <b>${fmt(e.key, Math.max(...vs))}</b></span></div>`);
}
const actions = {
  close: closeSheet,
  other() { showOther = true; render(); },
  swHelp() { openSheet({ type: "msg", title: "Карточка устройства", text: "Плитки климата и строки безопасности открывают карточку по нажатию. У плиток управления нажатие переключает устройство, а карточка открывается долгим нажатием. В карточке можно сменить название и комнату или скрыть устройство с панели." }); },
  num(t) { const [, e] = findEnt(t.dataset.e); if (!e) return; const o = e.opts || { min: 0, max: 100, step: 1 };
    const cur = e.value == null ? o.min : Number(e.value), v = Math.max(o.min, Math.min(o.max, cur + (+t.dataset.d) * uiStep(o))); if (v !== cur || e.value == null) setEnt(e, v); },
  sel(t) { const [, e] = findEnt(t.dataset.e); if (!e) return; const o = (e.opts?.options || []).find(x => String(x.value) === t.dataset.v); if (o && String(e.value) !== String(o.value)) setEnt(e, o.value); },
  async video() { const s = sheet;
    if (mode === "demo") { s.video = { err: "В демо-режиме видео нет: оно запрашивается у настоящей камеры через хаб." }; return drawSheet(); }
    s.video = { loading: true }; drawSheet();
    try { s.video = { url: (await api("video", { id: s.id })).url }; }
    catch (e) { s.video = { err: "Видео не получено. " + e.message }; }
    if (sheet === s) { drawSheet(); const v = $("#devVideo video"); let tries = 0; const arm = () => { const v = $("#devVideo video"); if (!v) return;
      v.onerror = () => { if (sheet !== s) return;
        if (tries++ < 2) return setTimeout(() => { if (sheet === s && s.video?.url) { drawSheet(); arm(); } }, 4000);   // трансляция может стартовать не сразу
        s.video = { err: "Камера выдала ссылку, но браузер не смог её воспроизвести." }; drawSheet(); }; };
      arm(); } },
  pick(t) { sheet.eid = t.dataset.e; sheet.data = null; drawSheet(); loadHistory(); },
  period(t) { sheet.hours = +t.dataset.h; sheet.data = null; drawSheet(); loadHistory(); },
  async saveHub() { let u = $("#hubUrl").value.trim(); if (u && !/^https?:\/\//.test(u)) u = "https://" + u; if (u && !u.endsWith("/")) u += "/";
    base = u; store.set("hubUrl", u); sheet.err = ""; const ok = u && await boot();
    if (sheet && sheet.type === "settings") { if (!ok && u) sheet.err = "Хаб по этому адресу не ответил. Проверьте адрес: он должен начинаться с https://"; drawSheet(); } },
  dropHub() { store.set("hubUrl", ""); location.reload(); },
  saveKey() { key = $("#keyInput").value.trim(); store.set("hubKey", key); closeSheet(); boot(); },
  async saveDev() { await editDev({ name: $("#devName").value.trim(), room: $("#devRoom").value.trim() }); },
  async toggleHide() { const d = state.devices.find(x => x.id === sheet.id); await editDev({ hidden: !d.hidden }); },
  async xiaomiLogin() { sheet.err = ""; try { sheet.qr = await api("xiaomi/login", {}); } catch (e) { sheet.err = "Не удалось начать вход: " + e.message; } drawSheet(); },
  async xiaomiLogout() { try { await api("xiaomi/logout", {}); } catch {} },
};
async function editDev(ch) {
  const d = state.devices.find(x => x.id === sheet.id);
  if (mode === "demo") { if (ch.name) d.name = ch.name; if ("room" in ch) d.room = ch.room || "Без комнаты"; if ("hidden" in ch) d.hidden = ch.hidden; closeSheet(); render(); return; }
  try { await api("device", { id: d.id, ...ch, name: ch.name === d.orig_name ? "" : ch.name }); closeSheet(); }
  catch (e) { sheet.err = e.message; drawSheet(); }
}
setInterval(() => { if (!sheet) render(); }, 60000);
boot();
})();
</script>
