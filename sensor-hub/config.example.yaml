# Настройки хаба. Скопируйте этот файл в config.yaml и правьте его.
# Без config.yaml хаб тоже работает: порт 8080, Xiaomi включён, ключа нет.

port: 8080

# Ключ доступа к панели. Пусто = панель открыта всем в домашней сети.
access_key: ""

sources:
  # Всё, что добавлено в Mi Home: Wi-Fi, а также Bluetooth и Zigbee через хаб Xiaomi.
  xiaomi:
    country: auto        # auto находит сам; можно указать ru, de, sg, us, cn, i2
    poll_seconds: 60

  # Bluetooth-датчики напрямую, адаптером этого компьютера (без хаба Xiaomi).
  # Чтобы включить, замените false на {}
  ble: false

  # Wi-Fi устройства Shelly: перечислите их адреса в домашней сети.
  # shelly:
  #   hosts: ["192.168.1.40", "192.168.1.41"]
  shelly: false

  # Тёплые полы с Wi-Fi термостатами на модуле Broadlink (Beok, Floureon, Hysen).
  # Работают, только когда хаб стоит дома, в одной сети с термостатами.
  # Чтобы включить, замените false на {} — хаб найдёт их сам. Или укажите адреса:
  # broadlink:
  #   hosts: ["192.168.1.50", "192.168.1.51"]
  broadlink: false

  # Примеры датчиков: auto = показывать, пока нет настоящих; off = никогда.
  demo:
    mode: auto
